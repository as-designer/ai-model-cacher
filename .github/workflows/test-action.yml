name: CI Test Action
on:
  workflow_dispatch: 

jobs:
  test-cache-workflow:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6.1.0
        
      - name: Run AI Cacher Action
        id: test-action
        uses: ./
        with:
          model-url: 'https://huggingface.co/Qwen/Qwen3-0.6B/resolve/main/model.safetensors'
          model-path: './models/model.safetensors'

      # Verify step output
      - name: Check Output
        run: |
          echo "Cache hit output was: ${{ steps.test-action.outputs.cache-hit }}"
          if [ ! -f ./models/model.safetensors ]; then
            echo "Error: Model file was not created!"
            exit 1
          fi
